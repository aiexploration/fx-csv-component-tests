spring:
  application:
    name: fx-csv-component-tests

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  datasource:
    url: jdbc:postgresql://localhost:5432/fxpayments
    driver-class-name: org.postgresql.Driver
    username: fxuser
    password: fxpassword

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

fx:
  component:
    test:
      # Folder scanned for CSV test-case files (override via -Dtest.data.dir)
      test-data-dir: ${test.data.dir:src/test/resources/test-data}
      # Single file to run (overrides directory scan); pass via -Dtest.data.file=<name>
      test-data-file: ${test.data.file:}
      # Max time to wait for each message to be processed (seconds)
      message-timeout-seconds: 15
      # Timestamp freshness window: domain payment must be <= N minutes old
      timestamp-freshness-minutes: 5
      # Output directory for HTML and CSV reports
      report-dir: ${report.dir:target/component-test-report}

logging:
  level:
    com.fx.csvtest: DEBUG
    com.fx.payment: INFO
    org.springframework.amqp: WARN
    com.rabbitmq: WARN
