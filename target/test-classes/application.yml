spring:
  application:
    name: fx-csv-component-tests

  # Override AUT's PostgreSQL datasource with H2 for in-process testing
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  rabbitmq:
    template:
      receive-timeout: 5000     # 5s – generous to allow AUT processing time

fx:
  inspection:
    h2:
      enabled: false      # disable H2 TCP/web inspection servers during component tests
      web:
        enabled: false

  component:
    test:
      # Folder scanned for CSV test-case files (override via -Dtest.data.dir)
      test-data-dir: ${test.data.dir:src/test/resources/test-data}
      # Max time to wait for each message to be processed (seconds)
      message-timeout-seconds: 15
      # Timestamp freshness window: domain payment must be <= N minutes old
      timestamp-freshness-minutes: 5
      # Output directory for HTML and CSV reports
      report-dir: ${report.dir:target/component-test-report}

logging:
  level:
    com.fx.csvtest: DEBUG
    com.fx.payment: INFO
    org.springframework.amqp: WARN
    com.rabbitmq: WARN
